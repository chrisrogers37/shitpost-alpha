name: engine

on:
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: engine
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests create and drop throwaway databases on this server.
      DEV_DATABASE_URL: postgresql://engine:engine@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Alembic has exactly one head
        run: |
          alembic heads
          test "$(alembic heads | grep -c '(head)')" -eq 1
