[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shitpost-engine"
version = "0.1.0"
description = "Always-on signal engine for shitpost-alpha"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4,<2.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["engine", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
