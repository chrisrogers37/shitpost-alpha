[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shitpost-engine"
version = "0.1.0"
description = "Always-on signal engine for shitpost-alpha"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.11,<2",
    "exchange-calendars>=4.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.3",
    "onnxruntime>=1.22,<2",
    "openai>=2.54,<3",
    "pandas>=3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "tokenizers>=0.21,<0.24",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4,<2.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.17",
]
crosscheck = [
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = [
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "market/collisions.json",
    "extract/*.json",
    "extract/prompts/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["engine", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "onnxruntime", "pandas", "yfinance"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
